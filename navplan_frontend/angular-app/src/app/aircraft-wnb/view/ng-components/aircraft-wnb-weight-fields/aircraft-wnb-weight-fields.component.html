<div class="weight-fields">
    <!-- mtow -->
    <app-weight-input
        [weight]="$safeNavigationMigration(this.currentAircraft?.mtow)"
        [defaultWeightUnit]="this.weightUnit"
        [isRequired]="true"
        (valueChanged)="this.onMtowChanged($event)"
    >MTOW</app-weight-input>
    <!-- empty aircraft weight -->
    <app-weight-input
        [weight]="$safeNavigationMigration(this.currentAircraft?.bew)"
        [defaultWeightUnit]="this.weightUnit"
        [isRequired]="true"
        (valueChanged)="this.onBewChanged($event)"
    >Empty Weight</app-weight-input>
</div>
